<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">

  <!-- Open Graph / Twitter Card -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:image" content="{{ '/images/assembled-hero.jpg' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ site.description | escape }}">
  <meta name="twitter:image" content="{{ '/images/assembled-hero.jpg' | absolute_url }}">

  <title>{% if page.title %}{{ page.title | escape }} | {{ site.title }}{% else %}{{ site.title | escape }}{% endif %}</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/jpeg" href="{{ '/images/hero.jpg' | relative_url }}">

  {%- feed_meta -%}
  {%- seo -%}
</head>
<body>
  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav">
        <a class="page-link" href="{{ '/#hero' }}">Home</a>
        <a class="page-link" href="{{ '/#hardware' }}">Hardware</a>
        <a class="page-link" href="{{ '/#demo' }}">Demo</a>
        <a class="page-link" href="{{ '/#gallery' }}">Gallery</a>
        <a class="page-link" href="{{ '/#download' }}">Download</a>
        <a class="page-link" href="{{ site.repository }}">GitHub ↗</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>{{ site.description | escape }}</p>
      <p>
        <a href="{{ site.repository }}">View on GitHub</a> ·
        <a href="{{ site.repository }}/blob/main/LICENSE">MIT License</a> ·
        Built with Jekyll
      </p>
    </div>
  </footer>
</body>
</html>
